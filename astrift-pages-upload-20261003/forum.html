<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050811" />
  <title>战区论坛 | 星隙前线</title>
  <script>
    if (location.hostname.endsWith('.pages.dev')) {
      const nativeFetch = window.fetch.bind(window), apiOrigin = 'https://astrift-front.fewa3729.workers.dev';
      window.fetch = (input, init) => { if (typeof input === 'string' && input.startsWith('/api/')) input = apiOrigin + input; return nativeFetch(input, init); };
    }
  </script>
  <link rel="stylesheet" href="/forum.css?v=20260929-1" />
  <script type="module" src="/forum.js?v=20260929-1"></script>
</head>
<body class="forumPage">
  <main class="forumShell">
    <header class="forumHeader"><div><span>ASTRIFT // COMMUNITY</span><h1>战区论坛</h1></div><a href="/">返回游戏</a></header>
    <section class="forumCompose">
      <form id="postForm">
        <label for="forumName">名字</label><input id="forumName" maxlength="20" autocomplete="nickname" placeholder="2–20 字，文明用语" required />
        <label for="forumBody">帖子内容</label><textarea id="forumBody" rows="4" placeholder="说点什么……" required></textarea>
        <div class="forumComposeFoot"><small id="forumCount">0 / 200</small><label id="forumPinWrap" hidden><input id="forumPin" type="checkbox" /> 发布为置顶帖</label><button type="submit">发布帖子</button></div>
      </form>
      <p id="forumStatus" role="status" aria-live="polite"></p>
    </section>
    <section class="forumFeed"><div class="forumFeedHead"><h2>最新帖子</h2><div><button id="forumRefresh" type="button">刷新</button><button id="forumAdmin" type="button">管理员</button></div></div>
      <form id="forumLogin" hidden><input id="forumPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="管理员密码" /><button type="submit">进入管理</button><button id="forumCancelLogin" type="button">取消</button></form>
      <div id="forumAdminState" hidden>管理员模式 <button id="forumLogout" type="button">退出管理</button></div>
      <div id="forumPosts"></div><button id="forumMore" type="button" hidden>加载更多</button>
    </section>
  </main>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><title>Forest visual QA</title><style>body{margin:0;background:#182b26;font:14px system-ui;color:#fff}nav{position:fixed;top:12px;left:12px;z-index:3;display:flex;gap:8px}button{padding:12px;background:#193e32cc;border:1px solid #9bcdb5;color:white;border-radius:8px}#stats{position:fixed;bottom:10px;left:12px;background:#142b20cc;padding:8px}canvas{display:block}</style></head><body><nav><button id="entrance">Entrance</button><button id="terrace">Elder terrace</button><button id="sanctum">Sanctum</button><button id="titan">Crystal titan</button></nav><div id="stats"></div><script type="module">
import * as T from '/three.module.js';import {buildForestScene,createAncientCreature,animateCreature} from '/ancient-scene.js';import {FOREST_ALTARS,forestHeight} from '/ancient-rules.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color(0x739a93);s.fog=new T.FogExp2(0x9db5a3,.004);s.add(new T.HemisphereLight(0xc7dfee,0x443a29,1.5));const sun=new T.DirectionalLight(0xffd7a0,2.3);sun.position.set(-30,65,-20);s.add(sun);buildForestScene(s);const c=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,450),actors=[];for(const a of FOREST_ALTARS){const m=createAncientCreature('crystal_'+a.element,65);m.position.set(a.x,10,a.z);s.add(m);actors.push(m)}const root=createAncientCreature('rootwarden',45);root.position.set(0,forestHeight(0,115),115);s.add(root);actors.push(root);for(let i=0;i<6;i++){const m=createAncientCreature('mossling',35);m.position.set(i%2?7:-7,0,42+i*9);s.add(m);actors.push(m)}
function view(x,y,z,tx,ty,tz){c.position.set(x,y,z);c.lookAt(tx,ty,tz)}document.querySelector('#entrance').onclick=()=>view(0,2,10,0,8,90);document.querySelector('#terrace').onclick=()=>view(-4,12,137,6,25,175);document.querySelector('#sanctum').onclick=()=>view(60,18,210,95,17,350);document.querySelector('#titan').onclick=()=>view(92,13,325,90,18,355);view(0,2,10,0,8,90);let previous=0;function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-previous)/1000);previous=t;for(const a of actors)animateCreature(a,{action:'walk',hp:1},t,dt);r.render(s,c);document.querySelector('#stats').textContent=`Draw calls: ${r.info.render.calls} · Triangles: ${r.info.render.triangles.toLocaleString()}`}requestAnimationFrame(frame);
</script></body></html>

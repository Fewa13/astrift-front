<!doctype html><html><head><meta charset="utf-8"><title>Blight map QA</title><style>body{margin:0;font:14px system-ui;color:white;background:#858093}nav{position:absolute;top:12px;left:12px;display:flex;gap:8px}button{padding:10px;color:#eee;background:#211d31dd;border:1px solid #a897bc;border-radius:6px}#stats{position:absolute;bottom:12px;left:12px;background:#211d31dd;padding:10px}canvas{display:block}</style></head><body><nav><button id="camp">边境营地</button><button id="village">侵蚀村落</button><button id="gorge">裂隙深谷</button><button id="boss">蚀心领主</button></nav><div id="stats">Loading…</div><script type="module">
import * as T from '../public/three.module.js';import {buildBlightScene,createBlightCreature} from '../public/ancient-blight-scene.js';import {blightSurface as blightHeight} from '../public/ancient-blight.js';import {animateCreature} from '../public/ancient-scene.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x858093);scene.fog=new T.FogExp2(0x9590a3,.0035);scene.add(new T.HemisphereLight(0xc7dfee,0x443a29,1.5));const sun=new T.DirectionalLight(0xffd7a0,2.3);sun.position.set(-30,65,-20);scene.add(sun);const camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,190),world=buildBlightScene(scene),creatures=[];for(const [kind,x,z]of [['blight_beast',4,60],['blight_stalker',3,278],['rift_maw',3,460],['blight_lord',0,600]]){const m=createBlightCreature(kind,100);m.position.set(x,blightHeight(x,z),z);scene.add(m);creatures.push(m)}const views={camp:[[-7,2,9],[-10,3,55]],village:[[-4,3,256],[-24,4,287]],gorge:[[0,-1,417],[6,-7,472]],boss:[[10,-10,578],[0,-10,601]]};for(const [id,v]of Object.entries(views))document.getElementById(id).onclick=()=>{camera.position.fromArray(v[0]);camera.lookAt(...v[1])};camera.position.fromArray(views.camp[0]);camera.lookAt(...views.camp[1]);let last=0,start=performance.now(),frames=0;function frame(t){requestAnimationFrame(frame);for(const m of creatures)animateCreature(m,{hp:100,action:'idle'},t,(t-last)/1000);last=t;renderer.render(scene,camera);if(++frames&&t-start>1000){document.getElementById('stats').textContent=`${Math.round(frames*1000/(t-start))} FPS · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles`;start=t;frames=0}}requestAnimationFrame(frame);
</script></body></html>

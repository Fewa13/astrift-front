<!doctype html><html><body style="margin:0;background:#17222c"><nav style="position:fixed;z-index:2" id="nav"></nav><script type="module">
import * as T from '../public/three.module.js';import {BESTIARY} from '../public/ancient-bestiary.js';import {createBestiaryCreature,animateBestiary} from '../public/ancient-bestiary-models.js';import {createBestiaryFX} from '../public/ancient-bestiary-fx.js';
const scene=new T.Scene();scene.background=new T.Color(0x17222c);scene.add(new T.HemisphereLight(0xd8edff,0x5b4034,2));const sun=new T.DirectionalLight(0xffd7a0,3);sun.position.set(-4,10,6);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:0x3b464c,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.05,80);camera.position.set(5,4,-7);camera.lookAt(0,1.5,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);const fx=createBestiaryFX(scene);let model,kind='brokenwing';const keys=Object.keys(BESTIARY);function choose(k){if(model)scene.remove(model);kind=k;model=createBestiaryCreature(k,50);scene.add(model)}for(const k of keys){const b=document.createElement('button');b.textContent=BESTIARY[k].en;b.onclick=()=>choose(k);nav.append(b)}choose(kind);renderer.setAnimationLoop(t=>{animateBestiary(model,{kind,hp:1,action:'walk',air:kind==='brokenwing'?.7:0},t,.016);fx.update();renderer.render(scene,camera)});
</script></body></html>

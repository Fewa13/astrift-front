<!doctype html><html><head><meta charset="utf-8"><title>Astrift · Independent Spell Visual QA</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1320;color:#dcefff;font:14px system-ui}header{padding:18px;background:#142337;position:sticky;top:0;z-index:2}button{float:right;background:#264b65;border:1px solid #598ba6;color:white;padding:6px 16px}main{position:relative}canvas{display:block}.labels{position:absolute;inset:0;display:grid;pointer-events:none}.label{padding:10px;border:1px solid #253344;font-weight:600;text-shadow:0 1px 4px #000}</style></head><body><header>ASTRIFT // ANCIENT AGE · 独立技能演出 <button id="play">播放动画</button></header><main><div class="labels" id="labels"></div></main><script type="module">
import * as THREE from '../public/three.module.js';import {createAncientMagicFX,ANCIENT_FX_IDS} from '../public/ancient-spell-fx.js';
const names=['体质强化 · VITALITY','伤害强化 · POWER','狂暴 · RAGE','裂空斩 · SLASH','召唤 · SUMMON','削弱 · WEAKEN','变身 · TRANSFORM','灵魂弹 · SOULBOLT','冰弹 · ICEBOLT','冰甲 · ICEARMOR','暴风雪 · BLIZZARD','连锁雷电 · CHAIN','雷霆加速 · HASTE','雷暴 · STORM','诅咒 · HEX','吸血 · DRAIN','末日 · DOOM','锁定 · MARK','兽爪 · CLAW','召唤兽命中 · PET HIT'];
const cols=innerWidth<800?2:4,w=innerWidth/cols,h=225,rows=Math.ceil(ANCIENT_FX_IDS.length/cols),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,rows*h);renderer.setPixelRatio(1);renderer.setScissorTest(true);document.querySelector('main').append(renderer.domElement);const labels=document.getElementById('labels');labels.style.gridTemplateColumns=`repeat(${cols},1fr)`;labels.style.gridAutoRows=h+'px';
const previews=ANCIENT_FX_IDS.map((id,i)=>{const label=document.createElement('div');label.className='label';label.textContent=names[i];labels.append(label);const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1721);const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshBasicMaterial({color:0x142c31}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);scene.add(new THREE.GridHelper(24,12,0x284541,0x203c38));const camera=new THREE.PerspectiveCamera(45,w/h,.1,100);camera.position.set(7,8,13);camera.lookAt(0,1.3,0);const fx=createAncientMagicFX(scene);const event={id,x:0,z:0,radius:['power','rage','icearmor','blizzard','storm','doom'].includes(id)?4:2,source:{x:-3,y:1.5,z:2}};fx.effect(event,()=>0);fx.update(150,.15);return {scene,camera,fx,event}});
let playing=false,last=performance.now(),elapsed=.15;document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停动画':'播放动画';last=performance.now()};function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing){elapsed+=dt;if(elapsed>8.5){elapsed=0;for(const p of previews){p.fx.clear();p.fx.effect(p.event,()=>0)}}else for(const p of previews)p.fx.update(t,dt)}previews.forEach((p,i)=>{const x=i%cols*w,y=rows*h-(Math.floor(i/cols)+1)*h;renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);renderer.render(p.scene,p.camera)});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>

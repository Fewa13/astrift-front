<!doctype html><html><head><meta charset="utf-8"><title>Lost Royal City visual QA</title><style>body{margin:0;background:#18222b;color:white;font:14px system-ui}nav{position:fixed;top:12px;left:12px;display:flex;gap:8px;z-index:3}button{padding:12px;border:1px solid #aac7d8;border-radius:8px;background:#213344cc;color:white}#stats{position:fixed;bottom:12px;left:12px;padding:10px;background:#152638bb}</style></head><body><nav><button id="ruins">废城</button><button id="street">街区</button><button id="interior">房屋</button><button id="roof">屋顶</button><button id="king">核心殿</button></nav><div id="stats"></div><script type="module">
import * as T from '/three.module.js';import {buildCityScene,createCityCreature} from '/ancient-city-scene.js';import {animateCreature} from '/ancient-scene.js';import {cityHeight} from '/ancient-city.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.25;document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color(0x778b9b);s.fog=new T.FogExp2(0x82909e,.0035);s.add(new T.HemisphereLight(0xc7dfee,0x443a29,1.5));const sun=new T.DirectionalLight(0xffd7a0,2.3);sun.position.set(-30,65,-20);s.add(sun);buildCityScene(s);const c=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,190),actors=[];for(const [kind,x,z]of [['city_husk',-4,50],['city_guard',4,235],['oathknight',0,335],['city_acolyte',8,450],['emptyking',0,520]]){const m=createCityCreature(kind,90);m.position.set(x,cityHeight(x,z),z);s.add(m);actors.push(m)}function view(x,y,z,tx,ty,tz){c.position.set(x,y,z);c.lookAt(tx,ty,tz)}document.querySelector('#ruins').onclick=()=>view(0,1.7,10,0,4,145);document.querySelector('#street').onclick=()=>view(0,1.7,193,0,3,290);document.querySelector('#interior').onclick=()=>view(30,1.7,216,30,2,199);document.querySelector('#roof').onclick=()=>view(30,9.7,216,0,2,285);document.querySelector('#king').onclick=()=>view(0,-10.3,485,0,-4,520);view(0,1.7,10,0,4,145);let last=0;function frame(t){requestAnimationFrame(frame);for(const a of actors)animateCreature(a,{action:'walk',hp:1},t,.016);r.render(s,c);document.querySelector('#stats').textContent='Draw calls: '+r.info.render.calls+' · Triangles: '+r.info.render.triangles.toLocaleString();last=t}requestAnimationFrame(frame);
</script></body></html>

<!doctype html><html><body style="margin:0;background:#b6d7de"><nav style="position:fixed;z-index:2"><button data-z="10">Outer Court</button><button data-z="190">Waterfall Bridge</button><button data-z="245">Mirror Gallery</button><button data-z="485">Temple</button><button id="solve">Solve Mirrors</button></nav><script type="module">

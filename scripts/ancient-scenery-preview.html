<!doctype html><html><head><meta charset="utf-8"><title>Scenery visual QA</title><style>body{margin:0;background:#7d989d;color:#fff;font:14px system-ui}nav{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}button{padding:10px;background:#193b35dd;border:1px solid #a8c6af;color:#fff;border-radius:5px}#stats{position:absolute;bottom:12px;left:12px;padding:8px;background:#122c25cc}canvas{display:block}</style></head><body><nav><button id="hut">房屋</button><button id="camp">篝火与架子</button><button id="altar">部落祭坛</button><button id="forest">森林</button><button id="crystal">元素祭坛</button><button id="city">王城</button></nav><div id="stats"></div><script type="module">
import * as T from '../public/three.module.js';import {buildAncientScene,buildForestScene} from '../public/ancient-scene.js';import {buildCityScene} from '../public/ancient-city-scene.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x9ab8c3);scene.fog=new T.FogExp2(0xc0c8b6,.005);scene.add(new T.HemisphereLight(0xc7dfee,0x443a29,1.5));const sun=new T.DirectionalLight(0xffd7a0,2.3);sun.position.set(-30,65,-20);scene.add(sun);const camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.05,190),worlds={tribe:buildAncientScene(scene)};let current='tribe';function view(map,eye,target){if(!worlds[map])worlds[map]=map==='forest'?buildForestScene(scene):buildCityScene(scene);for(const [k,v]of Object.entries(worlds))v.world.visible=k===map;current=map;camera.position.fromArray(eye);camera.lookAt(...target);scene.background.set(map==='forest'?0x739a93:map==='city'?0x778b9b:0x9ab8c3);scene.fog.color.set(map==='forest'?0x9db5a3:map==='city'?0x82909e:0xc0c8b6)}const views={hut:['tribe',[-15,3,28],[-27,3.8,45]],camp:['tribe',[-18,2.1,26],[-10,1.4,33]],altar:['tribe',[8,3,923],[0,4,950]],forest:['forest',[0,2,10],[0,9,70]],crystal:['forest',[81,12,285],[81,13,310]],city:['city',[0,3,55],[25,4,74]]};for(const [id,args]of Object.entries(views))document.getElementById(id).onclick=()=>view(...args);view(...views.hut);let frames=0,started=performance.now();function frame(time){requestAnimationFrame(frame);worlds[current].update?.(time);renderer.render(scene,camera);frames++;if(time-started>1000){document.getElementById('stats').textContent=`${Math.round(frames*1000/(time-started))} FPS · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles`;frames=0;started=time}}requestAnimationFrame(frame);
</script></body></html>

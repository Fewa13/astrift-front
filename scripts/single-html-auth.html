<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b151c;color:#e5f5ed;font:16px system-ui;display:grid;place-items:center;min-height:100vh}form{width:min(340px,80vw);padding:28px;background:#142a30;border:1px solid #5eaaa0;border-radius:16px;display:grid;gap:16px}input,select,button{font:inherit;padding:12px;border:1px solid #66968b;border-radius:6px;background:#0c1d23;color:inherit}label{display:grid;gap:6px}button{cursor:pointer}#error{color:#ffb4a9;white-space:pre-wrap}h1{margin:0}small{color:#a7c9bb}</style></head><body><form id="form"><small>ASTRIFT // ANCIENT AGE</small><h1>账号 / Account</h1><select id="action" aria-label="注册或登录 / Register or log in"><option value="login">登录 / Log in</option><option value="register">注册 / Register</option></select><label>账号名或邮箱 / Name or email<input id="name" autocomplete="username" required maxlength="254"></label><label>密码 / Password<input id="password" type="password" autocomplete="current-password" required></label><button id="forgot" type="button">忘记密码 / Forgot password</button><p id="error" role="alert"></p><button id="submit" type="submit">确认 / Continue</button><button id="back" type="button">返回 / Back</button></form><script>__EMAIL_UI_BUNDLE__</script><script>
(()=>{const keys=__CLOUD_KEYS__,form=document.getElementById('form'),action=document.getElementById('action'),button=document.getElementById('submit'),password=document.getElementById('password'),error=document.getElementById('error');const mailUI=AstriftAccountEmail.createAccountEmailUI({getSession:()=>JSON.parse(localStorage.getItem('astrift.accountSession.v1')||'null'),request:async(path,data)=>{const response=await AstriftAccountEmail.diagnosticFetch('https://play.astrift.com/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,device:localStorage.getItem('astrift.accountDevice.v1')})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'Request failed');return result;},onReset:()=>{localStorage.removeItem('astrift.accountSession.v1');action.value='login';action.onchange();password.value='';}});document.getElementById('forgot').onclick=()=>mailUI.openReset();action.value=new URLSearchParams(window.__ASTRIFT_START_SEARCH__||'').get('astriftAuth')==='register'?'register':'login';action.onchange=()=>{password.autocomplete=action.value==='register'?'new-password':'current-password';document.getElementById('name').maxLength=action.value==='register'?14:254;};action.onchange();document.getElementById('back').onclick=()=>window.parent.__ASTRIFT_SHELL__.switchWorld('ancient');form.onsubmit=async event=>{event.preventDefault();if(button.disabled)return;button.disabled=true;error.textContent='正在连接 / Connecting…';try{let device=localStorage.getItem('astrift.accountDevice.v1');if(!device||!/^[0-9a-f-]{36}$/i.test(device)){device=crypto.randomUUID();localStorage.setItem('astrift.accountDevice.v1',device)}const snapshot={};for(const key of keys){const value=localStorage.getItem(key);if(value!==null)snapshot[key]=value}const mode=action.value,response=await AstriftAccountEmail.diagnosticFetch('https://play.astrift.com/api/account/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value.trim().normalize('NFKC'),password:password.value,device,...(mode==='register'?{snapshot}:{})})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'登录失败 / Sign-in failed');if(typeof result.profile?.name!=='string'||!(/^[a-f0-9]{64}$/i.test(result.token)))throw Error('服务器响应无效 / Invalid server response');if(mode==='login')for(const key of keys){const value=result.profile.snapshot?.[key];if(typeof value==='string')localStorage.setItem(key,value);else localStorage.removeItem(key)}localStorage.setItem('astrift.accountSession.v1',JSON.stringify({name:result.profile.name,token:result.token,device}));localStorage.setItem('astrift.callsign',result.profile.name);password.value='';if(mode==='register')await mailUI.offer();window.parent.__ASTRIFT_SHELL__.switchWorld('ancient')}catch(e){error.textContent=e.message||'连接失败 / Connection failed'}finally{button.disabled=false;}};window.parent.__ASTRIFT_SHELL__.ready();})();
</script></body></html>

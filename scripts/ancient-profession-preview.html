<!doctype html><html><head><meta charset="utf-8"><title>Profession visual QA</title><style>body{margin:0;background:#101923;color:#d9e8ee;font:16px sans-serif}canvas{display:block}#labels{position:absolute;top:20px;left:5%;right:5%;display:flex;justify-content:space-around;pointer-events:none}</style></head><body><div id="labels"><span>战士 Warrior</span><span>召唤师 Summoner</span><span>冰雪 Ice</span><span>雷电 Lightning</span><span>诅咒 Curse</span><span>剑术 Swordsman</span></div><div style="position:absolute;bottom:20px;left:20px"><button id="rear">背面 / Back</button> <button id="chain">连锁雷电 / Chain</button> <span id="metrics"></span></div><script type="module">
import * as THREE from '/public/three.module.js';
import {createProfessionPlayer} from '/public/ancient-profession-models.js';
import {createAncientMagicFX} from '/public/ancient-spell-fx.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x101923);document.body.append(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,3,-12.5);camera.lookAt(0,1.2,0);scene.add(new THREE.HemisphereLight(0xc1dfff,0x263041,2));const light=new THREE.DirectionalLight(0xffe6bb,3);light.position.set(-3,6,-5);scene.add(light);const rim=new THREE.DirectionalLight(0x75adff,2);rim.position.set(3,3,4);scene.add(rim);const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,25),new THREE.MeshStandardMaterial({color:0x243042,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);const models=['warrior','summoner','ice','lightning','curse','swordsman'].map((job,i)=>{const m=createProfessionPlayer(job);m.position.x=(2.5-i)*2;scene.add(m);return m});const fx=createAncientMagicFX(scene);let last=0,rear=false,frames=0,started=performance.now();document.getElementById('rear').onclick=()=>rear=!rear;document.getElementById('chain').onclick=()=>fx.effect({id:'chain',x:3,z:0,source:{x:0,y:1.4,z:-3},links:[{x:3,y:1.35,z:0,height:1.35,target:'a'},{x:1,y:1.35,z:0,height:1.35,target:'b'},{x:-1,y:1.35,z:0,height:1.35,target:'c'},{x:-3,y:1.35,z:0,height:1.35,target:'d'}]},()=>0);function frame(time){requestAnimationFrame(frame);for(const m of models)m.rotation.y=(rear?Math.PI:0)+Math.sin(time*.0003)*.15;fx.update(time,Math.min(.05,(time-last)/1000));last=time;renderer.render(scene,camera);frames++;if(time-started>1000){document.getElementById('metrics').textContent=Math.round(frames*1000/(time-started))+' FPS · '+renderer.info.render.calls+' draws';frames=0;started=time}}requestAnimationFrame(frame);window.qa={scene,models,fx,renderer,camera};
</script></body></html>

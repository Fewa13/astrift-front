<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev</title>
<style>
body{margin:0;background:#0b151b;color:#e8f6f6;font:16px system-ui;min-height:100vh;display:grid;place-items:center}
form{background:#142730;padding:24px;border:1px solid #426c76;border-radius:12px;display:grid;gap:12px}
h1,p{margin:0} input,button{font:inherit;padding:10px;color:inherit;background:#102029;border:1px solid #426c76;border-radius:5px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
<form><h1>Dev</h1><label for="code">游玩码 / Play code</label><input id="code" required><button>进入 / Enter</button><output></output></form>
<script>
const key='Astrift-DevBuildAncient.activation.1';
const form=document.querySelector('form');
function start(){
 const frame=document.createElement('iframe');
 frame.title='Dev';
 frame.allow='fullscreen; autoplay; gamepad';
 frame.srcdoc=/*DEV_DOCUMENT*/;
 form.remove();
 document.body.append(frame);
}
form.onsubmit=async event=>{
 event.preventDefault();
 const button=form.querySelector('button'), output=form.querySelector('output');
 button.disabled=true;
 try{
  const response=await fetch('https://play.astrift.com/api/devbuild/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:form.querySelector('input').value.trim()})});
  const result=await response.json();
  if(!response.ok||!result.activation)throw Error(result.error||'兑换失败 / Could not redeem code');
  localStorage.setItem(key,result.activation);
  start();
 }catch(error){output.textContent=error.message;}
 finally{button.disabled=false;}
};
if(localStorage.getItem(key))start();
</script></html>
